name: autoparts-local
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: autoparts
      POSTGRES_USER: autoparts
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD}
    ports: ["127.0.0.1:55433:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoparts -d autoparts"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: { context: .., dockerfile: infrastructure/Dockerfile, target: api }
    environment:
      DATABASE_URL: postgresql://autoparts:${LOCAL_DB_PASSWORD}@db:5432/autoparts
      NODE_ENV: development
      DEMO_MODE: "true"
      API_HOST: 0.0.0.0
      API_PORT: 4310
      APP_ORIGINS: http://localhost:4173,http://127.0.0.1:4173
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set local DEMO_PASSWORD}
      DEMO_TOTP_SECRET: ${DEMO_TOTP_SECRET:?Set local DEMO_TOTP_SECRET}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set local MFA_ENCRYPTION_KEY}
    depends_on: { db: { condition: service_healthy } }
    command: ["sh","-c","node --import=tsx apps/api/src/migrate.ts && node --import=tsx apps/api/src/seed.ts && node --import=tsx apps/api/src/server.ts"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  business:
    build: { context: .., dockerfile: infrastructure/Dockerfile, target: business }
    ports: ["127.0.0.1:4173:80"]
    depends_on: { api: { condition: service_healthy } }
volumes:
  postgres-data:
