name: Phase 1 quality checks
on: [push, pull_request, workflow_dispatch]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env: { POSTGRES_DB: autoparts_ci, POSTGRES_USER: autoparts, POSTGRES_PASSWORD: isolated-ci-only }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autoparts -d autoparts_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.16.0, cache: npm }
      - run: npm ci
      - name: Generate isolated test configuration
        run: |
          node --input-type=module -e "import{randomBytes}from'node:crypto';import{writeFileSync}from'node:fs';writeFileSync('.env',['DATABASE_URL=postgresql://autoparts:isolated-ci-only@127.0.0.1:5432/autoparts_ci','DEMO_MODE=true','NODE_ENV=test','APP_ORIGINS=http://127.0.0.1:4173,http://localhost:4173','DEMO_PASSWORD='+randomBytes(24).toString('hex'),'DEMO_TOTP_SECRET=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP','MFA_ENCRYPTION_KEY='+randomBytes(32).toString('hex')].join('\n'))"
      - run: npm run typecheck
      - run: npm run build
      - run: npm run db:migrate && npm run db:seed
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Start local preview
        run: |
          npm run dev:api > /tmp/autoparts-api.log 2>&1 &
          npm run dev:business > /tmp/autoparts-business.log 2>&1 &
          node --input-type=module -e "for(let i=0;i<60;i++){try{if((await fetch('http://127.0.0.1:4173')).ok)break;}catch{}await new Promise(r=>setTimeout(r,1000));}"
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-evidence
          path: |
            docs/evidence/
            playwright-report/
            test-results/
          retention-days: 14
