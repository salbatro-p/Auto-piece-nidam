name: Company network rehearsal
on: [push, pull_request, workflow_dispatch]
permissions: { contents: read }
jobs:
  private-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_FILE: infrastructure/company.compose.yaml
      COMPANY_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.16.0, cache: npm }
      - run: npm ci
      - name: Configure an isolated company
        run: |
          umask 077
          for key in COMPANY_ADMIN_PASSWORD COMPANY_DB_PASSWORD COMPANY_MFA_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
          echo '{"database":"autoparts_company","company":"QA Atelier","locale":"fr","owner":{"name":"QA owner","email":"operator@example.invalid"},"warehouses":[{"code":"MAIN","name":"Counter"}]}' > "$RUNNER_TEMP/company.json"
      - name: Start the local-only container network
        run: |
          docker compose config --quiet
          docker compose up -d --build
          for i in $(seq 1 40); do
            if docker compose cp gateway:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/company-ca.crt"; then break; fi
            sleep 2
          done
          curl --fail --silent --retry 10 --retry-all-errors --cacert "$RUNNER_TEMP/company-ca.crt" https://localhost/api/health
          test "$(docker compose exec -T db psql -U postgres -d autoparts_company -Atc "SELECT NOT rolsuper AND NOT rolcreaterole AND NOT rolcreatedb FROM pg_roles WHERE rolname='autoparts_app'")" = t
      - name: Activate and exercise the private company via TLS
        run: |
          docker compose cp "$RUNNER_TEMP/company.json" api:/tmp/company.json
          docker compose exec -T api node --import=tsx apps/api/src/setup-company.ts /tmp/company.json /tmp/company-ticket
          docker compose cp api:/tmp/company-ticket "$RUNNER_TEMP/company-ticket"
          NODE_EXTRA_CA_CERTS="$RUNNER_TEMP/company-ca.crt" node --import=tsx scripts/company-network-check.mts
      - name: Verify persistence after a restart
        run: |
          docker compose restart db
          docker compose restart api business gateway
          curl --fail --silent --retry 15 --retry-delay 2 --retry-all-errors --cacert "$RUNNER_TEMP/company-ca.crt" https://localhost/api/health
          NODE_EXTRA_CA_CERTS="$RUNNER_TEMP/company-ca.crt" node --import=tsx scripts/company-network-check.mts --after-restart
